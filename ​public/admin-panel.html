<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لوحة تحكم MuteFlow</title>
    <style>
        body { font-family: system-ui, sans-serif; background: #0f172a; color: white; padding: 30px; margin: 0; }
        .container { max-width: 900px; margin: 0 auto; }
        h1 { color: #38bdf8; }
        .stats-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 20px; margin-bottom: 30px; }
        .stat-card { background: #1e293b; padding: 20px; border-radius: 12px; text-align: center; border: 1px solid #334155; }
        .stat-card h3 { margin: 0; color: #94a3b8; font-size: 0.9rem; }
        .stat-card div { font-size: 2rem; font-weight: bold; color: #38bdf8; margin-top: 10px; }
        .section { background: #1e293b; padding: 20px; border-radius: 12px; margin-bottom: 30px; border: 1px solid #334155; }
        table { width: 100%; border-collapse: collapse; margin-top: 15px; }
        th, td { padding: 12px; text-align: right; border-bottom: 1px solid #334155; }
        th { color: #38bdf8; }
        textarea { width: 100%; height: 100px; background: #0f172a; border: 1px solid #334155; color: white; padding: 10px; border-radius: 8px; box-sizing: border-box; }
        button { background: #22c55e; color: white; border: none; padding: 12px 20px; border-radius: 8px; cursor: pointer; font-weight: bold; margin-top: 10px; }
        button:hover { background: #16a34a; }
    </style>
</head>
<body>
    <div class="container">
        <h1>📊 لوحة تحكم MuteFlow Bot</h1>

        <div class="stats-grid">
            <div class="stat-card">
                <h3>إجمالي العمليات المعالجة</h3>
                <div id="processed-count">0</div>
            </div>
            <div class="stat-card">
                <h3>إجمالي المستخدمين</h3>
                <div id="users-count">0</div>
            </div>
        </div>

        <div class="section">
            <h2>📢 إرسال رسالة لكل المشتركين</h2>
            <textarea id="broadcast-msg" placeholder="اكتب الرسالة التي تريد إرسالها لجميع مستخدمي البوت..."></textarea>
            <button onclick="sendBroadcast()">إرسال الإذاعة الآن</button>
            <p id="broadcast-status" style="color: #4ade80;"></p>
        </div>

        <div class="section">
            <h2>👥 قائمة المشتركين</h2>
            <table>
                <thead>
                    <tr>
                        <th>ID</th>
                        <th>الاسم</th>
                        <th>اسم المستخدم</th>
                        <th>آخر ظهور</th>
                    </tr>
                </thead>
                <tbody id="users-list">
                </tbody>
            </table>
        </div>
    </div>

    <script>
        const DB_URL = "https://muteflow-41579-default-rtdb.firebaseio.com";

        async function loadData() {
            try {
                const processedRes = await fetch(`${DB_URL}/stats/total_processed.json`);
                document.getElementById('processed-count').innerText = (await processedRes.json()) || 0;

                const usersRes = await fetch(`${DB_URL}/users.json`);
                const users = await usersRes.json() || {};
                
                const userKeys = Object.keys(users);
                document.getElementById('users-count').innerText = userKeys.length;

                const tbody = document.getElementById('users-list');
                tbody.innerHTML = '';
                
                userKeys.forEach(key => {
                    const u = users[key];
                    tbody.innerHTML += `
                        <tr>
                            <td>${u.id || key}</td>
                            <td>${u.name || 'بدون اسم'}</td>
                            <td>${u.username || 'لا يوجد'}</td>
                            <td>${u.last_active || '-'}</td>
                        </tr>
                    `;
                });
            } catch (e) {
                console.error("Dashboard error:", e);
            }
        }

        async function sendBroadcast() {
            const msg = document.getElementById('broadcast-msg').value;
            if(!msg) return alert('اكتب رسالة أولاً');

            await fetch(`${DB_URL}/broadcast.json`, {
                method: 'PUT',
                body: JSON.stringify({ message: msg, status: 'pending' })
            });

            document.getElementById('broadcast-status').innerText = "تم إرسال الإذاعة للبوت وسيتم توصيلها لكل المستخدمين تلقائياً!";
            document.getElementById('broadcast-msg').value = '';
        }

        loadData();
        setInterval(loadData, 5000);
    </script>
</body>
</html>
