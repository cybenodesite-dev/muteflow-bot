<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MuteFlow Bot - فصل الموسيقى عن الصوت بالذكاء الاصطناعي</title>
    <style>
        :root {
            --bg-color: #0b0f19;
            --card-bg: #161e2e;
            --primary: #38bdf8;
            --primary-hover: #0284c7;
            --text-main: #f8fafc;
            --text-sub: #94a3b8;
            --accent: #22c55e;
        }

        body {
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
            text-align: center;
        }

        header {
            padding: 60px 20px 20px;
            max-width: 800px;
            margin: 0 auto;
        }

        .logo-icon {
            font-size: 3.5rem;
            margin-bottom: 15px;
        }

        h1 {
            font-size: 2.5rem;
            color: var(--primary);
            margin-bottom: 15px;
            font-weight: 800;
        }

        p.subtitle {
            font-size: 1.2rem;
            color: var(--text-sub);
            line-height: 1.6;
            margin-bottom: 30px;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 20px;
            max-width: 600px;
            margin: 0 auto 40px;
            padding: 0 20px;
            width: 100%;
            box-sizing: border-box;
        }

        .stat-card {
            background: var(--card-bg);
            border: 1px solid #1f293d;
            border-radius: 16px;
            padding: 25px 20px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.3);
        }

        .stat-card h3 {
            margin: 0;
            font-size: 0.95rem;
            color: var(--text-sub);
        }

        .stat-card .number {
            font-size: 2.2rem;
            font-weight: bold;
            color: var(--accent);
            margin-top: 10px;
        }

        .buttons-container {
            display: flex;
            flex-direction: column;
            gap: 15px;
            max-width: 400px;
            margin: 0 auto;
            padding: 0 20px;
            width: 100%;
            box-sizing: border-box;
        }

        .btn {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            padding: 16px 24px;
            border-radius: 12px;
            font-size: 1.1rem;
            font-weight: bold;
            text-decoration: none;
            transition: all 0.2s ease;
        }

        .btn-telegram {
            background-color: var(--primary);
            color: #000;
        }

        .btn-telegram:hover {
            background-color: var(--primary-hover);
            color: #fff;
        }

        .btn-support {
            background-color: var(--card-bg);
            color: #facc15;
            border: 1px solid #334155;
        }

        .btn-support:hover {
            background-color: #1e293b;
        }

        footer {
            margin-top: auto;
            padding: 30px 20px;
            color: var(--text-sub);
            font-size: 0.9rem;
            border-top: 1px solid #1f293d;
        }
    </style>
</head>
<body>

    <header>
        <div class="logo-icon">🎧</div>
        <h1>MuteFlow Bot</h1>
        <p class="subtitle">البوت الأسرع والأسهل لإزالة الموسيقى من الفيديوهات والصوتيات مع الحفاظ على وضوح النطق الأصلي بالكامل.</p>
    </header>

    <div class="stats-grid">
        <div class="stat-card">
            <h3>الفيديوهات والصوتيات المعالجة</h3>
            <div class="number" id="processed-count">...</div>
        </div>
        <div class="stat-card">
            <h3>المستخدمين النشطين</h3>
            <div class="number" id="users-count">...</div>
        </div>
    </div>

    <div class="buttons-container">
        <a href="https://t.me/MuteFlow_bot" class="btn btn-telegram" target="_blank">
            <span>تجربة البوت على Telegram</span>
        </a>
        <a href="https://muteflow.web.app/help" class="btn btn-support">
            <span>💛 ادعم مشروع MuteFlow</span>
        </a>
    </div>

    <footer>
        &copy; 2026 MuteFlow Bot. جميع الحقوق محفوظة.
    </footer>

    <script>
        const DB_URL = "https://muteflow-41579-default-rtdb.firebaseio.com";

        async function fetchLiveStats() {
            try {
                const processedRes = await fetch(`${DB_URL}/stats/total_processed.json`);
                const processedData = await processedRes.json();
                document.getElementById('processed-count').innerText = processedData || 0;

                const usersRes = await fetch(`${DB_URL}/users.json`);
                const usersData = await usersRes.json();
                const usersCount = usersData ? Object.keys(usersData).length : 0;
                document.getElementById('users-count').innerText = usersCount;
            } catch (error) {
                console.error("خطأ في جلب الإحصائيات:", error);
                document.getElementById('processed-count').innerText = '0';
                document.getElementById('users-count').innerText = '0';
            }
        }

        fetchLiveStats();
        setInterval(fetchLiveStats, 5000);
    </script>
</body>
</html>
